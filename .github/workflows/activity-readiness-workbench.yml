name: Activity readiness workbench
on:
  push:
    branches: [feature/private-owner-activity]
    paths: [.github/workflows/activity-readiness-workbench.yml]
permissions:
  contents: write
jobs:
  update-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/private-owner-activity
      - name: Keep UI assertions and stop treating network silence as page readiness
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['tests/table-refinement-ui.mjs','tests/mobile-usability-ui.mjs','tests/home-footer-ui.mjs','tests/install-ui.mjs']
          for name in files:
            p=Path(name);s=p.read_text()
            assert 'networkidle' in s,name
            s=s.replace("waitUntil:'networkidle'","waitUntil:'domcontentloaded'").replace("waitUntil: 'networkidle'","waitUntil: 'domcontentloaded'")
            s='// Page readiness is checked by the existing UI locators below. Foreground presence is periodic network traffic.\n'+s
            p.write_text(s)
          PY
          git add tests/table-refinement-ui.mjs tests/mobile-usability-ui.mjs tests/home-footer-ui.mjs tests/install-ui.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wait for actionable game UI instead of network silence; retain all layout and interaction checks'
          git push origin HEAD:feature/private-owner-activity
