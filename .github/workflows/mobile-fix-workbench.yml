name: Mobile fix workbench
on:
  push:
    branches: [fix/mobile-play-and-ai-turns]
    paths: [.github/workflows/mobile-fix-workbench.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-play-and-ai-turns
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply only the reviewed source edits
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python scripts/mobile-fix-patch.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/components/AccountControls.tsx app/components/DrawCardButton.tsx app/components/HandCards.tsx app/components/ParkesApp.tsx app/layout.tsx lib/draw-card-drag.ts lib/room-server.ts lib/rummy.ts tests/draw-card-drag.test.ts
          git commit -m 'Fix native mobile swipes, remove duplicate player labels, and validate faster AI turns'
          git push origin HEAD:refs/heads/fix/mobile-play-and-ai-turns
      - run: npm install
      - run: npm run typecheck
      - name: Legal AI and existing engine regressions
        run: node --import tsx --test tests/bot-turn.test.ts tests/rummy.test.ts tests/original-rules.test.ts tests/rule-progression.test.ts tests/draw-card-drag.test.ts
      - run: npm run build
      - name: Install browser tests
        run: npm install --no-save --package-lock=false playwright && npx playwright install --with-deps chromium
      - name: Mobile touch and first-screen checks
        run: node --import tsx tests/mobile-usability-ui.mjs
      - name: Save review screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-usability-results
          path: mobile-usability-results/
          if-no-files-found: ignore
          retention-days: 3
