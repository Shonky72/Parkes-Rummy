name: Parkes Rummy CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: parkes-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  schema-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Verify simultaneous cold workers against real PostgreSQL
        env:
          PARKES_SCHEMA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node --import tsx tests/schema-startup-postgres.mjs
      - name: Save concurrent schema startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-startup-results
          path: schema-startup-results/
          if-no-files-found: error
          retention-days: 14
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: node --import tsx --test tests/original-rules.test.ts tests/tutorial.test.ts tests/quick-play.test.ts tests/tutorial-coaching.test.ts tests/phone-install.test.ts tests/bot-turn.test.ts tests/bot-turn-api.test.ts tests/rummy.test.ts tests/rule-progression.test.ts tests/draw-card-drag.test.ts tests/meld-layout.test.ts tests/request-origin.test.ts tests/activity.test.ts tests/hand-reveal.test.ts
      - run: npm run test:backend
      - name: Verify advertising stays limited to consented public guides
        run: node --import tsx --test tests/advertising.test.ts tests/monetization.test.ts
      - name: Verify records, frozen challenges, clubs and ranked integrity
        run: node --import tsx --test tests/deployment-context.test.ts tests/client-identity.test.ts tests/records-engine.test.ts tests/records-api.test.ts tests/records-room-api.test.ts tests/competition.test.ts tests/competition-api.test.ts tests/ladder-api.test.ts
      - name: Verify finished-game streak credit and one-time celebrations
        run: node --import tsx --test tests/play-streak.test.ts tests/play-streak-api.test.ts tests/play-streak-repository.test.ts tests/streak-celebration.test.ts tests/streak-audio.test.ts tests/audio-playback.test.ts
      - run: node tests/activity-fixture.mjs && npm run build
      - run: rm -rf app/__activity_ui_fixture
      - name: Verify public content and discovery without JavaScript
        run: node tests/public-content-http.mjs
      - name: Install browser test tools
        id: browser_tools
        run: npx playwright install --with-deps chromium
      - name: Verify private owner dashboard and foreground presence
        run: node --import tsx tests/activity-ui.mjs
      - name: Verify approval, microphone cancellation, consent and CSP in Chromium
        run: node --import tsx tests/security-browser.mjs
      - name: Verify approved starts, connected voice and end-hand reveal
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        run: node --import tsx tests/reveal-session-ui.mjs
      - name: Verify all three gamification releases through real services and isolated SQL
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        run: node --import tsx tests/gamification-ui.mjs
      - name: Verify earned records appear after the full winning-card reveal
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        run: node --import tsx tests/records-result-ui.mjs
      - name: Save gamification screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamification-results
          path: gamification-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save authenticated result-highlight screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: records-result-results
          path: records-result-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save reveal and session screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reveal-session-results
          path: reveal-session-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Save owner dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-activity-results
          path: owner-activity-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Verify compact melds, pending feedback and one-hand Quick Play
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        run: node --import tsx tests/table-refinement-ui.mjs
      - name: Verify native phone gestures and immediate play access
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        run: node --import tsx tests/mobile-usability-ui.mjs
      - name: Verify home footer and stationary desktop layout
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        run: node tests/home-footer-ui.mjs
      - name: Verify tutorial popups in the browser
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        run: node tests/tutorial-ui.mjs && node tests/tutorial-responsive-ui.mjs
      - name: Verify installation guide in the browser
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        run: node tests/install-ui.mjs
      - name: Confirm real Chrome Origin on Netlify preview
        if: ${{ github.event_name == 'pull_request' }}
        env:
          NETLIFY_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node tests/netlify-room-origin.mjs
      - name: Confirm built Netlify preview cannot write competition or visitor records
        if: ${{ github.event_name == 'pull_request' }}
        env:
          NETLIFY_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node tests/netlify-deployment-context.mjs
      - name: Save table refinement screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: table-refinement-results
          path: table-refinement-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save mobile screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-usability-results
          path: mobile-usability-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save home footer screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-footer-ui-results
          path: home-footer-ui-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save tutorial screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-ui-results
          path: tutorial-ui-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save installation screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-ui-results
          path: install-ui-results/
          if-no-files-found: ignore
          retention-days: 7

