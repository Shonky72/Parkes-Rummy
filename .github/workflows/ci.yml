name: Parkes Rummy CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: parkes-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: node --import tsx --test tests/original-rules.test.ts tests/tutorial.test.ts tests/quick-play.test.ts tests/tutorial-coaching.test.ts tests/phone-install.test.ts tests/bot-turn.test.ts tests/bot-turn-api.test.ts tests/rummy.test.ts tests/rule-progression.test.ts tests/draw-card-drag.test.ts tests/meld-layout.test.ts tests/request-origin.test.ts tests/activity.test.ts
      - run: npm run test:backend
      - run: node tests/activity-fixture.mjs && npm run build
      - run: rm -rf app/__activity_ui_fixture
      - name: Install browser test tools
        id: browser_tools
        run: npx playwright install --with-deps chromium
      - name: Verify private owner dashboard and foreground presence
        run: node --import tsx tests/activity-ui.mjs
      - name: Verify approval, microphone cancellation, consent and CSP in Chromium
        run: node --import tsx tests/security-browser.mjs
      - name: Save owner dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-activity-results
          path: owner-activity-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Verify compact melds, pending feedback and one-hand Quick Play
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        run: node --import tsx tests/table-refinement-ui.mjs
      - name: Verify native phone gestures and immediate play access
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        run: node --import tsx tests/mobile-usability-ui.mjs
      - name: Verify home footer and stationary desktop layout
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        run: node tests/home-footer-ui.mjs
      - name: Verify tutorial popups in the browser
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        run: node tests/tutorial-ui.mjs && node tests/tutorial-responsive-ui.mjs
      - name: Verify installation guide in the browser
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        run: node tests/install-ui.mjs
      - name: Confirm real Chrome Origin on Netlify preview
        if: ${{ github.event_name == 'pull_request' }}
        env:
          NETLIFY_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node tests/netlify-room-origin.mjs
      - name: Save table refinement screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: table-refinement-results
          path: table-refinement-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save mobile screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-usability-results
          path: mobile-usability-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save home footer screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-footer-ui-results
          path: home-footer-ui-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save tutorial screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-ui-results
          path: tutorial-ui-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save installation screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-ui-results
          path: install-ui-results/
          if-no-files-found: ignore
          retention-days: 7
