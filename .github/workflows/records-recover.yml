name: Recover saved records source
on:
  push:
    branches: [feature/rule-records-achievements]
    paths: [.github/workflows/records-recover.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Recover the saved partial stream for review only
        run: |
          python - <<'PY'
          import base64,lzma
          from pathlib import Path
          p=Path('.review/records-release.1.xz64')
          data=lzma.LZMADecompressor().decompress(base64.b64decode(p.read_text()))
          Path('/tmp/recovered-records.patch').write_bytes(data)
          print('Recovered bytes:',len(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-records-patch
          path: /tmp/recovered-records.patch
          retention-days: 1
