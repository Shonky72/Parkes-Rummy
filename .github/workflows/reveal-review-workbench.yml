name: Reveal review workbench
on:
  push:
    branches: [fix/reveal-voice-approved-start]
    paths: [.github/workflows/reveal-review-workbench.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reveal-voice-approved-start
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check received audio after transport connects
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/reveal-session-ui.mjs');s=p.read_text()
          old="  const received=await page.evaluate(async()=>{let bytes=0;for(const p of window.testVoicePeers){for(const r of (await p.getStats()).values()){if(r.type==='inbound-rtp'&&r.kind==='audio')bytes+=r.bytesReceived||0;}}return bytes;});\n  assert.ok(received>0,'Real synthetic audio reached the other browser');"
          new="  await page.waitForFunction(async()=>{let bytes=0;for(const p of window.testVoicePeers){for(const r of (await p.getStats()).values()){if(r.type==='inbound-rtp'&&r.kind==='audio')bytes+=r.bytesReceived||0;}}return bytes>0;},null,{timeout:10000,polling:200});"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          git add tests/reveal-session-ui.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Verify real synthetic voice packets after connected peers begin receiving media'
          git push origin HEAD:fix/reveal-voice-approved-start
      - run: npm ci
      - run: npm run typecheck
      - run: node --import tsx --test tests/hand-reveal.test.ts tests/security.test.ts tests/voice-lifecycle.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Exercise approval, voice and end-hand presentation
        run: node --import tsx tests/reveal-session-ui.mjs
      - name: Save reveal and session screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reveal-session-results
          path: reveal-session-results/
          if-no-files-found: ignore
          retention-days: 3
