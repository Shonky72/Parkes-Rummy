name: Apply Quick Play refinements
on:
  push:
    branches: [fix/quick-hand-and-meld-readability]
    paths: [.github/workflows/apply-quick-refinements.yml, scripts/apply-quick-hand-refinement.py]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/quick-hand-and-meld-readability'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact-match source edits
        run: python scripts/apply-quick-hand-refinement.py
      - name: Commit only the six reviewed source files to the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/types.ts lib/rummy.ts lib/room-server.ts app/components/ParkesApp.tsx app/layout.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'Implement single-hand Quick Play, compact melds and responsive move feedback'
            git push origin HEAD:fix/quick-hand-and-meld-readability
          fi
