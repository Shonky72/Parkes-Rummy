name: Owner activity workbench
on:
  push:
    branches: [feature/private-owner-activity]
    paths: [.github/workflows/owner-activity-workbench.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/private-owner-activity
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply tested activity refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/activity-server.ts');s=p.read_text();s=s.replace('return result.rowCount === 1;','return result.rows.length === 1;');p.write_text(s)
          p=Path('db/activity.ts');s=p.read_text();s=s.replace('$1-300000','$1::bigint-300000').replace('$1-86400000','$1::bigint-86400000').replace('$1-20000','$1::bigint-20000')
          if "import { after } from 'next/server';" not in s:s="import { after } from 'next/server';\n"+s
          old="  try { await activityRepository.gameStarted(room); } catch { console.warn('Activity statistics temporarily unavailable'); }"
          new="  try {\n    after(async () => {\n      try { await activityRepository.gameStarted(room); } catch { console.warn('Activity statistics temporarily unavailable'); }\n    });\n  } catch { /* Direct engine tests have no HTTP lifecycle. Never block or fail a game response for telemetry. */ }"
          s=s.replace(old,new);p.write_text(s)
          PY
          git add lib/activity-server.ts db/activity.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Keep owner checks strict and activity writes off the game-response path'
            git push origin HEAD:feature/private-owner-activity
          fi
      - run: npm install
      - run: npm run typecheck
      - run: node --import tsx --test tests/activity.test.ts
